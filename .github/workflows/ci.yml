# CI — the checks `make check` and the offline test suite run, split so a
# failure names itself.
#
# The backend depends on Apple Vision, sandbox-exec, Apple Foundation Models and
# macOS screen capture, so the real suite runs on macOS. A cheap Linux job keeps
# formatting and the platform-independent shared crate honest without claiming
# Linux support. The Playwright suite is minutes of work against a demo backend
# and runs only on main or on demand; packaging lives in the release workflow.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only, declared rather than inherited. Nothing here publishes anything —
# the release workflow is where write access belongs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux-check:
    name: Format and shared crate (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the version development happens on, so rustfmt and clippy can
      # never disagree with a local `make check`.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.0
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Shared crate
        run: cargo test -p causewaybay-shared

  macos:
    name: Clippy, build and offline tests (macOS)
    # apple-vision builds Swift that needs the macOS 26 SDK (Xcode 26).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # `make check`, one step per tool so the log says which one failed.
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy (native crates)
        run: cargo clippy -p causewaybay-server -p causewaybay-shared -p causewaybay-cli --all-targets -- -D warnings
      - name: Clippy (WASM frontend)
        run: cargo clippy -p causewaybay-frontend --target wasm32-unknown-unknown -- -D warnings

      # Listed separately so a compile error does not read as a test failure.
      - name: Build
        run: cargo build -p causewaybay-server -p causewaybay-cli

      # Wallet mode must be off for the test backends, or around forty tests
      # fail with 401. Live tests that need provider keys, Apple Vision
      # fixtures, a model download or a real screen are #[ignore] and stay out.
      - name: Rust tests
        run: env -u CWBBOT_ADMIN cargo test -p causewaybay-server -p causewaybay-shared -p causewaybay-cli
      - name: Frontend crate tests
        run: cargo test -p causewaybay-frontend
      - name: Script tests
        run: npm run test:scripts

  browser:
    name: Browser tests (macOS, manual or main)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install npm packages and browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Build debug web assets and binaries
        run: make build-debug

      # A couple of specs depend on real OCR timing; the report is uploaded
      # either way so a flaky spec can be told apart from a regression.
      - name: Playwright
        run: env -u CWBBOT_ADMIN npm run test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
