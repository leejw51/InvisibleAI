[package]
name = "causewaybay-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "causewaybay"
path = "src/main.rs"

[dependencies]
causewaybay-shared.workspace = true
serde_json.workspace = true
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
base64 = "0.22"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
# Audio Capture: WAV encoding of each utterance (and replaying a fixture file).
hound = "3.5"

# The microphone itself: CoreAudio through cpal. Opened only when the backend
# asks the CLI to listen, never at startup.
[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
axum = "0.8"
causewaybay-server = { path = "../server", default-features = false }
