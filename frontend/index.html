<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f7f4" />
  <meta name="description" content="Invisible AI — private help, anytime, anywhere." />
  <title>Invisible AI · Your thinking space</title>
  <link data-trunk rel="rust" href="../crates/frontend/Cargo.toml" data-wasm-opt="0" />
  <link data-trunk rel="copy-dir" href="assets" />
  <script src="/assets/theme.js"></script>
  <script type="module" src="/assets/status-diagram.js"></script>
  <script type="module" src="/assets/wiki-graph.js"></script>
  <script type="module" src="/assets/everyday-motion.js"></script>
  <link rel="stylesheet" href="/assets/app.css" />
  <link rel="preload" href="/assets/everyday-companion.png" as="image" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <main class="connection-splash">
    <section class="connection-stage" role="status" aria-live="polite" aria-atomic="true">
      <div class="connection-kicker">INVISIBLE AI</div>
      <div class="connection-sculpture" aria-hidden="true">
        <span class="connection-aura"></span>
        <span class="connection-orbit orbit-one"><i></i></span>
        <span class="connection-orbit orbit-two"><i></i></span>
        <img class="connection-orb" src="/assets/everyday-companion.png" width="192" height="192" alt="" />
      </div>
      <h1>A little clarity, on its way.</h1>
      <p class="connection-stage-caption">Opening your thinking space…<span class="connection-ellipsis" aria-hidden="true"><i></i><i></i><i></i></span></p>
      <div class="connection-journey" aria-hidden="true"><span class="journey-node">◌</span><span class="journey-thread"><i></i></span><span class="journey-node">✧</span></div>
      <div class="connection-journey-labels" aria-hidden="true"><span>Your browser</span><span>Your workspace</span></div>
    </section>
  </main>
</body>
</html>
