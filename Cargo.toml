[workspace]
members = ["crates/server", "crates/frontend", "crates/shared", "crates/cli"]
default-members = ["crates/server", "crates/shared"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
causewaybay-shared = { path = "crates/shared" }

# Video uploads are checked with SHA-256 on both ends; unoptimized it hashes
# at ~35 MB/s, which made `finish` take half a minute for 1 GB under
# `make start` (a debug build). Optimizing just these crates keeps debug
# builds fast to compile.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
